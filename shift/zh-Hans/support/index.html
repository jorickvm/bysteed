<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

<body>
  <main>
    <header>
      <svg class="dots" viewBox="0 0 283 67" aria-hidden="true">
        <circle cx="33.5" cy="33.5" r="33.5" fill="#00af7e" />
        <circle cx="141.5" cy="33.5" r="33.5" fill="#e44151" />
        <circle cx="249.5" cy="33.5" r="33.5" fill="#f5a216" />
      </svg>
      <h1>Shift 支持</h1>
    </header>

    <div class="policy">
      <p class="lede">获取 Shift 使用帮助，或直接向开发者提交反馈。</p>

      <section>
        <h2>联系</h2>
        <p>请发送邮件至 <a href="mailto:shift@bysteed.com?subject=Shift%20%E6%94%AF%E6%8C%81">shift@bysteed.com</a>。报告问题时，请附上 Shift 版本、设备型号、iOS 或 iPadOS 版本，以及导致问题的操作步骤。</p>
      </section>

      <section>
        <h2>数据</h2>
        <p>Shift 不设账户，也不使用云服务。训练历史、设置和当前计时器状态只保存在设备上。详情请参阅 <a href="/shift/zh-Hans/privacy/">Shift 隐私政策</a>。</p>
      </section>
    </div>

    <footer><a href="/shift/zh-Hans/">Shift</a><span class="theme-switch"><button type="button" data-theme-choice="light" aria-label="Light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg></button><button type="button" data-theme-choice="dark" aria-label="Dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" /></svg></button></span></footer>
