<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steed</title>
  <meta name="description" content="Apps by Jorick: Shift, Stallion and AtlasDays.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Steed</h1>
    <p class="intro">Apps by Jorick.</p>

    <ul class="apps">
      <li>
        <a class="app" href="/shift/">
          <picture>
            <source srcset="/assets/icons/shift-dark.png" media="(prefers-color-scheme: dark)">
            <img src="/assets/icons/shift.png" alt="" width="64" height="64">
          </picture>
          <span class="text">
            <span class="name">Shift</span>
            <span class="line">An interval timer for workouts</span>
          </span>
          <span class="go">App Store</span>
        </a>
      </li>
      <li>
        <a class="app" href="/stallion/">
          <img src="/assets/icons/stallion.png" alt="" width="64" height="64">
          <span class="text">
            <span class="name">Stallion</span>
            <span class="line">Notes on every Health workout</span>
          </span>
          <span class="go">Coming soon</span>
        </a>
      </li>
      <li>
        <a class="app" href="https://atlasdays.app">
          <picture>
            <source srcset="/assets/icons/atlasdays-dark.png" media="(prefers-color-scheme: dark)">
            <img src="/assets/icons/atlasdays.png" alt="" width="64" height="64">
          </picture>
          <span class="text">
            <span class="name">AtlasDays</span>
            <span class="line">Track visas, residency, and travel</span>
          </span>
          <span class="go">atlasdays.app</span>
        </a>
      </li>
    </ul>

    <footer>© 2026 Steed</footer>
  </main>
</body>
</html>
